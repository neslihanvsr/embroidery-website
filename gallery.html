<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore the artistic portfolio of HoyThreads Embroidery. View unique handmade pieces, filterable by category.">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.hoythreads.com/gallery.html"> <!-- Placeholder URL -->
    <meta property="og:title" content="HoyThreads Embroidery - Gallery & Portfolio">
    <meta property="og:description" content="Explore a curated collection of our handmade embroidery art, showcasing craftsmanship and diverse designs.">
    <meta property="og:image" content="assets/images/branding/product-photo-2.jpg"> <!-- Updated to use branding cat photo -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.hoythreads.com/gallery.html"> <!-- Placeholder URL -->
    <meta property="twitter:title" content="HoyThreads Embroidery - Gallery & Portfolio">
    <meta property="twitter:description" content="Explore a curated collection of our handmade embroidery art, showcasing craftsmanship and diverse designs.">
    <meta property="twitter:image" content="assets/images/branding/product-photo-2.jpg"> <!-- Updated to use branding cat photo -->

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/icons/favicon-16x16.png">
    <link rel="manifest" href="assets/images/icons/site.webmanifest">
    <link rel="mask-icon" href="assets/images/icons/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <!-- Google Fonts for Fraunces and Inter (placeholder, will be self-hosted later if needed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head> 
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="header-root"></div> 
    <main role="main" id="main-content">
        <section class="gallery-section">
            <div class="container">
                <h1 class="section-title">Our Artistic Portfolio</h1>
                <p class="text-center" style="margin-bottom: var(--space-5);">
                    Explore a curated collection of our handmade embroidery art, showcasing craftsmanship and diverse designs.
                </p>
                <!-- Gallery filtering controls will be dynamically loaded here by gallery.js -->
                <div id="gallery-filters" class="category-filters">
                    <p class="text-center" style="grid-column: 1 / -1;">Loading filters...</p>
                </div>
                <!-- Gallery items will be dynamically loaded here by gallery.js -->
                <div id="gallery-grid" class="grid grid--2-col-tablet grid--3-col-desktop">
                    <p class="text-center" style="grid-column: 1 / -1;">Loading gallery items...</p>
                </div>
            </div>
        </section> 
    </main>

    <!-- Lightbox HTML Structure --> 
    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="lightbox__content">
            <button class="lightbox__close" aria-label="Close lightbox">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button class="lightbox__prev" aria-label="Previous image">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <img class="lightbox__image" src="" alt="">
            <button class="lightbox__next" aria-label="Next image">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-right"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <div class="lightbox__caption">
                <h3 class="lightbox__caption-title"></h3>
                <p class="lightbox__caption-description"></p>
            </div>
        </div>
    </div>

    
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer__social-links" role="contentinfo" aria-label="Social media links">
                    <a href="#" aria-label="Instagram"><img src="assets/images/icons/instagram.png" alt="" width="24" height="24"></a>
                    <a href="#" aria-label="Pinterest"><img src="assets/images/icons/pinterest.png" alt="" width="24" height="24"></a>
                    <a href="#" aria-label="Etsy"><img src="assets/images/icons/etsy.png" alt="" width="24" height="24"></a>
                </div>
                <p class="footer__copyright">&copy; 2023 HoyThreads Embroidery. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script type="module" src="assets/js/gallery.js"></script> <!-- This script will load and render gallery items -->
</body>
</html>
